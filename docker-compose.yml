# Job Manager — production stack for an Ubuntu VPS, served over plain HTTP on
# the server's public IP (no domain / TLS).
#
#   cp .env.example .env               # then set SESSION_SECRET
#   docker compose up -d --build       # first deploy and every later deploy
#
# Services:
#   server   Express API (internal only, port 4000 on the compose network)
#   client   one-shot: builds the React app and copies dist/ into the
#            `client_dist` volume, then exits
#   nginx    serves `client_dist` as static files and proxies /api/ to
#            `server`; published on host port ${HTTP_PORT:-80}
services:
  server:
    build: ./server
    container_name: jobmanager-server
    environment:
      # Must listen on all interfaces so nginx (another container) can reach it.
      HOST: 0.0.0.0
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Plain HTTP: the session cookie must NOT be HTTPS-only, or login fails.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
    volumes:
      # SQLite database persisted on the host.
      - ./server/data:/app/data
      # Tectonic's TeX bundle cache (resume PDFs) — avoids re-downloading.
      - tectonic_cache:/root/.cache
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  client:
    build: ./client
    container_name: jobmanager-client
    volumes:
      - client_dist:/srv/www
    restart: "no"

  nginx:
    build: ./nginx
    container_name: jobmanager-nginx
    depends_on:
      client:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - client_dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  client_dist:
  tectonic_cache:
