# Job Manager — plain HTTP on the server's public IP (no domain, no TLS).

# Docker's embedded DNS. Used with a variable proxy_pass so nginx re-resolves
# the `server` container after it is recreated (otherwise 502s until restart).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Static files from the `client_dist` volume (populated by the client container).
    root /usr/share/nginx/html;
    index index.html;

    # API accepts JSON bodies up to 15mb (base64 resumes).
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API -----------------------------------------------------------------
    location /api/ {
        set $api_upstream http://server:4000;
        # No URI part on proxy_pass => the full /api/... path is forwarded as-is.
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resume generation / PDF compile can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- Static assets -------------------------------------------------------
    # Vite emits content-hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
